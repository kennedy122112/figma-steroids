name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs
      - run: npm test
      # El comando de una sola vez, de punta a punta sin escribir nada, en cada sistema.
      - run: node bin/figma-steroids.mjs setup --dry-run --no-open --wait 0
