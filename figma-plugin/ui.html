<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: var(--figma-color-bg, #ffffff);
    --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
    --text: var(--figma-color-text, #1e1e1e);
    --muted: var(--figma-color-text-secondary, #6b6b6b);
    --border: var(--figma-color-border, #e6e6e6);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --on-brand: var(--figma-color-text-onbrand, #ffffff);
    --ok: var(--figma-color-text-success, #14ae5c);
    --warn: var(--figma-color-text-warning, #b86200);
    --danger: var(--figma-color-text-danger, #dc3412);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 11px/16px Inter, system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  header { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--warn); }
  .dot.connected { background: var(--ok); }
  .dot.paused { background: var(--danger); }
  #status { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 5px; padding: 3px 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  button:hover { background: var(--bg-2); }
  button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  #pause.active { background: var(--danger); border-color: var(--danger); color: #fff; }
  .icon { padding: 3px 6px; }
  .rows { padding: 6px 10px; display: grid; gap: 4px; }
  .row { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .label { color: var(--muted); flex: none; width: 54px; }
  .value { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .id { font-family: ui-monospace, Consolas, monospace; color: var(--muted); }
  .small { padding: 1px 6px; font-weight: 500; }
  #log-wrap { display: none; border-top: 1px solid var(--border); }
  body.expanded #log-wrap { display: block; }
  .log-head { display: flex; align-items: center; gap: 6px; padding: 6px 10px; color: var(--muted); }
  .log-head span { flex: 1; }
  #log { list-style: none; margin: 0; padding: 0 6px 8px; height: 276px; overflow-y: auto; }
  #log li { padding: 4px; border-radius: 4px; cursor: pointer; }
  #log li:hover { background: var(--bg-2); }
  #log li.restored .time { font-style: italic; }
  .entry { display: flex; gap: 6px; align-items: center; }
  .time { color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
  .what { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { flex: none; font-size: 10px; padding: 0 5px; border-radius: 8px; background: var(--bg-2); color: var(--muted); }
  .tag.write { background: var(--brand); color: var(--on-brand); }
  .tag.error { background: var(--danger); color: #fff; }
  .show { flex: none; padding: 0 5px; font-size: 10px; font-weight: 500; line-height: 14px; }
  .detail { display: none; margin: 4px 0 0; padding: 6px; border-radius: 4px; background: var(--bg-2);
    font-family: ui-monospace, Consolas, monospace; font-size: 10px; line-height: 14px; white-space: pre-wrap; word-break: break-all; }
  #log li.open .detail { display: block; }
  .err { color: var(--danger); }
  .empty, .divider { color: var(--muted); padding: 8px 4px; cursor: default; }
  .divider { padding: 6px 4px 2px; border-top: 1px dashed var(--border); margin-top: 4px; }
  .hint { color: var(--muted); padding: 0 10px 8px; }
</style>
</head>
<body>
  <header>
    <div id="dot" class="dot" aria-hidden="true"></div>
    <span id="status" role="status">Conectando…</span>
    <button id="pause" title="Detener a la IA: rechaza sus comandos hasta reanudar">Pausar</button>
    <button id="toggle" class="icon" title="Mostrar actividad" aria-expanded="false">▾</button>
  </header>

  <div class="rows">
    <div class="row"><span class="label">Archivo</span><span id="file" class="value">—</span></div>
    <div class="row">
      <span class="label">Selección</span>
      <span id="sel" class="value">Nada seleccionado</span>
      <button id="copy" class="small" hidden>Copiar ID</button>
    </div>
  </div>
  <div class="hint">Deja esta ventana abierta mientras trabajas con la IA.</div>

  <section id="log-wrap" aria-label="Actividad">
    <div class="log-head">
      <span>Actividad de la IA</span>
      <button id="copy-log" class="small" title="Copiar todo el registro como texto">Copiar</button>
      <button id="clear" class="small" title="Borrar el registro de este archivo">Limpiar</button>
    </div>
    <ul id="log"></ul>
  </section>

<script>
  // ---- Conexión con el daemon (igual que el plugin FigCli) ----
  const PORTS = [3456, 3457, 3458, 3459, 3460];
  let ws = null;
  let reconnectTimer = null;
  let keepaliveTimer = null;
  let lastPong = Date.now();
  let paused = false;
  const pending = new Map(); // id -> { code, summary, at }

  const $ = (id) => document.getElementById(id);
  const post = (pluginMessage) => parent.postMessage({ pluginMessage }, '*');

  function setStatus(text, state) {
    $('status').textContent = text;
    $('dot').className = 'dot ' + (paused ? 'paused' : state);
  }

  function connectParallel() {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    setStatus('Buscando el daemon…', 'connecting');
    let connected = false;
    const attempts = [];

    PORTS.forEach((port) => {
      try {
        const socket = new WebSocket(`ws://127.0.0.1:${port}/plugin`);
        attempts.push(socket);
        socket.onopen = () => {
          if (connected) { socket.close(); return; }
          connected = true;
          ws = socket;
          attempts.forEach((s) => {
            if (s !== socket) { s.onclose = null; s.onerror = null; try { s.close(); } catch (e) {} }
          });
          ws.onmessage = handleMessage;
          ws.onclose = handleClose;
          ws.onerror = handleClose;
          setStatus(paused ? 'En pausa' : 'Conectado', 'connected');
          post({ type: 'connected' });
          ws.send(JSON.stringify({ type: 'hello', mode: 'plugin', version: 'figma-steroids-1.1.0' }));
          startKeepalive();
        };
        socket.onclose = () => {};
        socket.onerror = () => {};
      } catch (e) {}
    });

    setTimeout(() => {
      if (!connected) {
        attempts.forEach((s) => { s.onclose = null; try { s.close(); } catch (e) {} });
        setStatus('Esperando al daemon…', 'connecting');
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectParallel, 300);
      }
    }, 1500);
  }

  function handleMessage(event) {
    let msg;
    try { msg = JSON.parse(event.data); } catch (e) { return; }
    if (msg.action === 'eval') {
      pending.set(msg.id, { code: msg.code, summary: summarize(msg.code), at: new Date() });
      post({ type: 'eval', id: msg.id, code: msg.code });
    }
    if (msg.action === 'eval-batch') {
      const summaries = [...new Set(msg.codes.map(summarize))];
      pending.set(msg.id, {
        code: msg.codes.join('\n\n// ----\n\n'),
        summary: `Lote de ${msg.codes.length}: ${summaries.join(', ')}`,
        at: new Date(),
      });
      post({ type: 'eval-batch', id: msg.id, codes: msg.codes });
    }
    if (msg.action === 'ping') ws.send(JSON.stringify({ type: 'pong', id: msg.id }));
    if (msg.type === 'pong') lastPong = Date.now();
  }

  function handleClose() {
    if (ws && ws.readyState !== WebSocket.OPEN) {
      ws = null;
      setStatus('Reconectando…', 'connecting');
      stopKeepalive();
      post({ type: 'disconnected' });
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connectParallel, 200);
    }
  }

  function startKeepalive() {
    stopKeepalive();
    lastPong = Date.now();
    keepaliveTimer = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        if (Date.now() - lastPong > 8000) { ws.close(); return; }
        ws.send(JSON.stringify({ type: 'ping' }));
      }
    }, 3000);
  }

  function stopKeepalive() {
    if (keepaliveTimer) { clearInterval(keepaliveTimer); keepaliveTimer = null; }
  }

  function send(payload) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(payload));
  }

  // ---- Resumen legible de cada comando (el daemon solo envía código) ----
  function summarize(code) {
    const rules = [
      [/createTextStyle/, 'Crear estilos de texto'],
      [/combineAsVariants|createComponent/, 'Crear componentes'],
      [/setBoundVariable/, 'Vincular variables'],
      [/createVariable\b|createVariableCollection/, 'Crear variables'],
      [/\.remove\(\)/, 'Borrar nodos'],
      [/create(Frame|Text|Rectangle|Ellipse|Line|Vector)|createNodeFromSvg|appendChild/, 'Crear nodos'],
      [/exportAsync/, 'Exportar imagen'],
      [/getLocalVariables|getLocalVariableCollections/, 'Leer variables'],
      [/getLocalTextStyles/, 'Leer estilos'],
      [/\.selection/, 'Leer selección'],
      [/figma\.root\.name/, 'Leer el archivo'],
      [/findAll|findOne|getNodeById/, 'Leer nodos'],
    ];
    for (const [re, label] of rules) if (re.test(code)) return label;
    return 'Ejecutar código';
  }

  // ---- Registro ----
  // Cada entrada es un dato { id, at, summary, ms, code, error, paused, changes, nodeIds, final,
  // restored } y su <li>. Figma informa de los cambios con ~1 s de retraso: la entrada nace como
  // "…" y se actualiza con cada aviso; si no llega ninguno en FINAL_MS, queda como lectura.
  // Se guarda por archivo (clientStorage) para revisarlo al volver a abrir el plugin.
  const FINAL_MS = 3600;
  const MAX_ENTRIES = 100;
  let log = []; // más reciente primero
  const items = new Map(); // id -> { data, li }
  const earlyChanges = new Map(); // cambios que llegan antes que el resultado
  let saveTimer = null;

  const hasChanges = (c) => !!(c && (c.created || c.deleted || c.modified));

  function tagOf(e) {
    if (e.paused) return { text: 'pausado', cls: 'error' };
    if (e.error && !hasChanges(e.changes)) return { text: 'error', cls: 'error' };
    if (hasChanges(e.changes)) {
      const c = e.changes;
      const parts = [];
      if (c.created) parts.push(`+${c.created}`);
      if (c.modified) parts.push(`~${c.modified}`);
      if (c.deleted) parts.push(`−${c.deleted}`);
      return { text: (e.error ? 'error ' : '') + parts.join(' '), cls: e.error ? 'error' : 'write' };
    }
    return e.final ? { text: 'lectura', cls: '' } : { text: '…', cls: '' };
  }

  function timeLabel(e) {
    const d = new Date(e.at);
    const today = new Date().toDateString() === d.toDateString();
    const hm = d.toTimeString().slice(0, 8);
    return today ? hm : `${d.getDate()}/${d.getMonth() + 1} ${hm.slice(0, 5)}`;
  }

  function renderEntry(item) {
    const e = item.data;
    const tag = tagOf(e);
    const tagEl = item.li.querySelector('.tag');
    tagEl.textContent = tag.text;
    tagEl.className = 'tag ' + tag.cls;
    const c = e.changes;
    tagEl.title = c ? `creados ${c.created} · modificados ${c.modified} · borrados ${c.deleted}` : '';
    item.li.querySelector('.show').hidden = !(e.nodeIds && e.nodeIds.length);
  }

  function buildLi(e) {
    const li = document.createElement('li');
    if (e.restored) li.classList.add('restored');
    li.innerHTML =
      `<div class="entry"><span class="time"></span><span class="what"></span>` +
      `<button class="show small" title="Seleccionar en el lienzo lo que hizo este comando" hidden>Ver</button>` +
      `<span class="tag"></span></div><div class="detail"></div>`;
    li.querySelector('.time').textContent = timeLabel(e);
    li.querySelector('.time').title = new Date(e.at).toLocaleString();
    li.querySelector('.what').textContent = e.summary + (e.ms ? ` · ${e.ms} ms` : '');
    const detail = li.querySelector('.detail');
    if (e.error) {
      const err = document.createElement('div');
      err.className = 'err';
      err.textContent = e.error;
      detail.appendChild(err);
    }
    detail.appendChild(document.createTextNode(e.code));
    li.querySelector('.show').addEventListener('click', (ev) => {
      ev.stopPropagation();
      post({ type: 'show-nodes', ids: e.nodeIds });
    });
    li.addEventListener('click', () => li.classList.toggle('open'));
    return li;
  }

  function showEmptyIfNeeded() {
    const list = $('log');
    if (!list.children.length) list.innerHTML = '<li class="empty">Todavía no hay actividad.</li>';
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const entries = log.slice(0, MAX_ENTRIES).map((e) => ({ ...e, final: true, restored: true }));
      post({ type: 'save-log', entries });
    }, 800);
  }

  function addLog(id, info, error) {
    const p = pending.get(id);
    pending.delete(id);
    if (!p) return;
    const list = $('log');
    const empty = list.querySelector('.empty');
    if (empty) empty.remove();

    const early = earlyChanges.get(id);
    earlyChanges.delete(id);
    const e = {
      id,
      at: p.at.getTime(),
      summary: p.summary,
      ms: info && info.ms,
      code: p.code.length > 600 ? p.code.slice(0, 600) + '…' : p.code,
      error: error || null,
      paused: !!(info && info.paused),
      changes: (early && early.changes) || (info && info.changes) || null,
      nodeIds: (early && early.nodeIds) || [],
      final: !!(info && info.paused),
    };
    const item = { data: e, li: buildLi(e) };
    items.set(id, item);
    log.unshift(e);
    list.prepend(item.li);
    while (log.length > MAX_ENTRIES) {
      log.pop();
      const last = [...list.children].reverse().find((li) => !li.classList.contains('divider'));
      if (last) last.remove();
    }
    renderEntry(item);
    scheduleSave();
    setTimeout(() => { e.final = true; renderEntry(item); items.delete(id); scheduleSave(); }, FINAL_MS);
  }

  function restoreLog(entries) {
    if (log.length) return; // ya hay actividad nueva: no mezclar
    const list = $('log');
    list.innerHTML = '';
    const divider = document.createElement('li');
    divider.className = 'divider';
    divider.textContent = 'De sesiones anteriores';
    list.appendChild(divider);
    for (const e of entries) {
      log.push(e);
      const item = { data: e, li: buildLi(e) };
      list.appendChild(item.li);
      renderEntry(item);
    }
  }

  function logAsText() {
    return log.slice().reverse().map((e) => {
      const tag = tagOf({ ...e, final: true }).text;
      const when = new Date(e.at).toLocaleString();
      return `${when}  ${e.summary}${e.ms ? ` (${e.ms} ms)` : ''}  [${tag}]` + (e.error ? `\n  error: ${e.error}` : '');
    }).join('\n');
  }

  // En el iframe del plugin el portapapeles moderno puede estar bloqueado: se usa execCommand.
  function copyText(text) {
    const area = document.createElement('textarea');
    area.value = text;
    document.body.appendChild(area);
    area.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    area.remove();
    return ok;
  }

  // ---- Mensajes del hilo principal del plugin ----
  let selection = [];
  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'result') {
      send({ type: 'result', id: msg.id, result: msg.result, error: msg.error });
      addLog(msg.id, msg.log, msg.error);
    }
    if (msg.type === 'batch-result') {
      send({ type: 'batch-result', id: msg.id, results: msg.results });
      const failed = msg.results.filter((r) => !r.success);
      addLog(msg.id, msg.log, failed.length ? `${failed.length} de ${msg.results.length} fallaron: ${failed[0].error}` : null);
    }
    if (msg.type === 'changes') {
      const item = items.get(msg.id);
      if (item) {
        item.data.changes = msg.changes;
        item.data.nodeIds = msg.nodeIds || [];
        renderEntry(item);
        scheduleSave();
      } else {
        earlyChanges.set(msg.id, { changes: msg.changes, nodeIds: msg.nodeIds || [] });
      }
    }
    if (msg.type === 'restore-log') restoreLog(msg.entries);
    if (msg.type === 'file') {
      $('file').textContent = `${msg.file} · ${msg.page}`;
      $('file').title = `${msg.file} · página ${msg.page}`;
    }
    if (msg.type === 'selection') {
      selection = msg.selection;
      const sel = $('sel');
      if (!selection.length) {
        sel.textContent = 'Nada seleccionado';
        $('copy').hidden = true;
      } else {
        const first = selection[0];
        sel.innerHTML = '';
        sel.append(document.createTextNode(first.name + ' '));
        const id = document.createElement('span');
        id.className = 'id';
        id.textContent = first.id + (selection.length > 1 ? ` +${selection.length - 1}` : '');
        sel.append(id);
        sel.title = selection.map((s) => `${s.name} (${s.id})`).join('\n');
        $('copy').hidden = false;
        $('copy').textContent = selection.length > 1 ? 'Copiar IDs' : 'Copiar ID';
      }
    }
  };

  // ---- Controles ----
  $('pause').addEventListener('click', () => {
    paused = !paused;
    $('pause').classList.toggle('active', paused);
    $('pause').textContent = paused ? 'Reanudar' : 'Pausar';
    post({ type: 'set-paused', paused });
    setStatus(paused ? 'En pausa' : (ws && ws.readyState === WebSocket.OPEN ? 'Conectado' : 'Reconectando…'),
      ws && ws.readyState === WebSocket.OPEN ? 'connected' : 'connecting');
  });

  $('toggle').addEventListener('click', () => {
    const expanded = !document.body.classList.contains('expanded');
    document.body.classList.toggle('expanded', expanded);
    $('toggle').textContent = expanded ? '▴' : '▾';
    $('toggle').setAttribute('aria-expanded', String(expanded));
    $('toggle').title = expanded ? 'Ocultar actividad' : 'Mostrar actividad';
    post({ type: 'resize', size: expanded ? 'expanded' : 'collapsed' });
  });

  $('clear').addEventListener('click', () => {
    log = [];
    items.clear();
    $('log').innerHTML = '';
    showEmptyIfNeeded();
    post({ type: 'clear-log' });
  });

  $('copy-log').addEventListener('click', () => {
    if (!log.length) { post({ type: 'notify', text: 'El registro está vacío.' }); return; }
    const ok = copyText(logAsText());
    post({ type: 'notify', text: ok ? `Registro copiado (${log.length} entradas)` : 'No se pudo copiar el registro' });
  });

  $('copy').addEventListener('click', () => {
    const text = selection.map((s) => s.id).join(', ');
    const ok = copyText(text);
    post({ type: 'notify', text: ok ? `Copiado: ${text}` : `ID: ${text}` });
  });

  showEmptyIfNeeded();
  connectParallel();
</script>
</body>
</html>
