    <rect x="16" y="76" width="56" height="20" rx="10" fill="#a259ff"/>
    <path d="M165 55 H205" stroke="#fde047" stroke-width="4" stroke-linecap="round"/>
    <path d="M195 45 L207 55 L195 65" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="220" y="0" width="110" height="110" rx="12" fill="#0b0a1f" stroke="#a5b4fc" stroke-opacity="0.6"/>
