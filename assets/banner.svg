  <text x="76" y="205" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#c7d2fe">De la idea a Figma, y de Figma a tu código.</text>
  <text x="76" y="250" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#a5b4fc">Skills y agentes de Claude Code · sin API key · sin MCP · sin límites</text>

