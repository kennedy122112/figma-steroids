    <text x="246" y="62" font-family="Consolas, Menlo, monospace" font-size="16" fill="#93c5fd">&lt;btn/&gt;</text>
    <text x="236" y="86" font-family="Consolas, Menlo, monospace" font-size="16" fill="#86efac">&lt;/card&gt;</text>
